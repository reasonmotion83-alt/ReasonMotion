name: "h36m"
data_dir: "./data/h36m"

# H3.6M alignment and split settings
protocol: "standard"          
joints: 17

# Prediction window
input_n: 25
output_n: 100

# Sampling and missing-data settings
skip_rate: 5
val_skip_rate: 5
downsample: 2
miss_type: "no_miss"
miss_rate: 0

# Other data processing
no_overlap: false
all_data: true
data_ratio: 1.0
pad_short_sequences: false
