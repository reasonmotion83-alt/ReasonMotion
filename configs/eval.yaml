# ReasonMotion evaluation hyperparameters and switches config (configs/eval.yaml)

# Experiment output directory path (e.g. outputs/rl_finefs_2026-07-15_15-08)
exp_dir: "outputs/rl_finefs_experiment"
# Checkpoint loading settings (-1 means auto-select the latest)
epoch: -1              # 1-based epoch (e.g. 10)
step: 10620               # RL step count (e.g. 3900)
ckpt: ""               # Directly specify a particular .ckpt file path (takes precedence over epoch/step)

# Evaluation run hyperparameters
batch_size: 64         # Evaluation batch size
nsample: 5             # Number of samples generated per prompt (Best-of-N)
device: "1"         # Execution device (e.g. "cuda", "cuda:0", "0", "cpu")
quick: false           # Quick-test mode (evaluate only 1% of the data)

# Output result saving settings
save_dir: ""           # Custom directory for saving results (defaults to <exp_dir>/eval)
no_save: false         # If true, do not save evaluation result logs/json to disk
