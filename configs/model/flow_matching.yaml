name: "flow_matching"

# 1. Core text-injection strategy
text_encoder: "sentence-transformer"
textemb_dim: 384
text_mode: "adaln"  # AdaLN performs extremely well in Flow Matching (similar to the DiT architecture)

# 2. Flow Matching generative model architecture
diffusion:
  channels: 64
  layers: 12
  nheads: 8
  diffusion_embedding_dim: 128
  timeemb_dim: 128
  featureemb_dim: 16

  # === Flow Matching-specific settings ===
  num_steps: 10             # Number of ODE integration steps (Flow Matching's straight-line property means 10~20 steps achieve very high quality)
  # [Note]: removed beta_start, beta_end, schedule since Flow Matching does not rely on a variance schedule

  is_unconditional: 0

# 3. MoE auxiliary experiments
moe:
  enabled: false
  multirouter: false
  use_r3: false
  balance_loss: false
  balance_loss_weight: 0.01
