name: "sft_baseline"

# 1. Core text-injection strategy (keeping only the most critical experiments)
text_encoder: "sentence-transformer"
textemb_dim: 384
# Options supported by the text injection mode (text_mode):
# - cross_attn: The original approach. Fully flattens the (K*L) spatial and temporal dims into an extremely long sequence for global attention with text; the most computationally expensive.
# - decoupled_cross_attn: A decoupled approach. Only aligns the time axis (L) with the text during the forward_time stage; faster and better matches the temporal nature of motion descriptions.
# - adaln: Adaptive LayerNorm (similar to Sora / DiT). Uses the global text feature directly for scale/shift, with no attention computation; fastest convergence and strongest CFG signal penetration.
# - token: (legacy option, kept for compatibility) Directly treated as a feature token participating in concatenation.
text_mode: "adaln"

# 2. Diffusion model base architecture
diffusion:
  channels: 64
  layers: 12
  nheads: 8
  diffusion_embedding_dim: 128
  timeemb_dim: 128
  featureemb_dim: 16
  beta_start: 0.0001
  beta_end: 0.5
  num_steps: 50
  schedule: "cosine"
  is_unconditional: 0

# 3. MoE auxiliary experiments (all disabled by default for SFT, to keep a clean baseline)
moe:
  enabled: false
  multirouter: false
  use_r3: false
  balance_loss: false
  balance_loss_weight: 0.01

# Note: removed unused "ghost" parameters from the original codebase (e.g. decouple_spatial_temporal, use_rot_loss, etc.)
