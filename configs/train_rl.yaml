defaults:
  - dataset: finefs
  - _self_

sft_dir: "" # Must be provided on the command line, e.g. python train_rl.py sft_dir=outputs/YYYY-MM-DD_HH-MM-SS
sft_ckpt: null # Can specify a specific SFT checkpoint filename or a fuzzy-matched substring (e.g. sft_ckpt="epoch=50")

quick_test: false

# Override training parameters from the SFT stage
training:
  lr: 5e-6
  epochs: 50
  batch_size: 2
  batch_size_test: 1
  valid_epoch_interval: 1
  grad_clip: 1.0
  save_top_k: -1            # Limit on the number of checkpoints to save (-1 means save all, for tracking training dynamics)
  val_check_interval: 30    # Run validation and visualization every 30 steps (batches)
  log_every_n_steps: 10     # Log metrics every 10 steps
  limit_val_batches: 5      # Limit the number of validation batches to speed up validation

# RL-specific settings
rl:
  lr_schedule:
    type: step
    step_size: 5000
    gamma: 0.5
  ppo_epochs: 2
  epsilon: 0.2
  kl_coef: 0.05
  kl_clip_value: 0.2
  num_samples_per_prompt: 16
  sampling_std: 1.0
  
  # Reward weights
  w_gt: 0.0
  w_smooth: 0.1
  w_score: 0.9
  fs_reward_ckpt: "./utils/fs_reward_utils/checkpoints_goe/best_model_goe.pth"

  smooth_floor: 0.0
  smooth_floor_penalty: 0.0

  # Reference Update
  update_ref_every_epoch: 2    # Update once after every 1 epoch
  ref_ema_alpha: 0.5           # EMA update rate (0.01 = absorb 1% new weights each time, 1.0 = hard copy)

  # Delayed Sub-Trajectory (continuous/discrete hybrid sampling mechanism)
  delayed_sub_trajectory:
    enabled: true
    sampling_mode: discrete    # 'continuous' (random window) | 'discrete' (discrete uniform random)
    window_size: 5             # Window size in continuous mode
    num_discrete_steps: 5      # Number of steps randomly sampled in discrete mode

  # Ablation Study switches for 5 improvements
  ablation:
    advantage_clamp:
      enabled: false
      min_std: 1e-4
      clamp_val: 3.0
    adaptive_kl:
      enabled: false
      target_kl: 0.05
      kl_min: 0.001
      kl_max: 0.5
    noise_annealing:
      enabled: false
      start_std: 0.02
      min_std: 0.005
      decay_rate: 0.95
    step_decay_advantage:
      enabled: false
      power: 1.0
    topk_gating:
      enabled: false
      ratio: 0.5

# PyTorch Lightning system settings
system:
  accelerator: "gpu"
  devices: [1,2]            # GPU devices specifically assigned for the RL stage
  strategy: "ddp_find_unused_parameters_true"
  precision: "32-true"
  seed: 42

exp_name: "rl"

# Override Hydra's default output directory naming scheme, unified to outputs/rl_finefs_YYYY-MM-DD_HH-MM
hydra:
  run:
    dir: outputs/${exp_name}_${dataset.name}_${now:%Y-%m-%d_%H-%M}

# Dataset override settings
dataset:
  filter_single_rotation: true  # Whether to filter out single-rotation jumps (noisy samples such as 1A/1Lz)
