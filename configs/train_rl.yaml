defaults:
  - dataset: finefs
  - _self_

sft_dir: "" # 必須由命令列提供，例如 python train_rl.py sft_dir=outputs/YYYY-MM-DD_HH-MM-SS
sft_ckpt: null # 可以指定特定的 SFT Checkpoint 檔名或模糊比對子字串 (如 sft_ckpt="epoch=50")

quick_test: false

# 覆蓋 SFT 階段的訓練參數
training:
  lr: 5e-6
  epochs: 50
  batch_size: 2
  batch_size_test: 1
  valid_epoch_interval: 1
  grad_clip: 1.0
  save_top_k: -1            # 儲存 Checkpoint 的數量限制 (-1 代表儲存全部，方便觀察流變)
  val_check_interval: 30    # 每 30 個 step (batch) 進行一次驗證與視覺化
  log_every_n_steps: 10     # 每 10 個 step 記錄一次指標
  limit_val_batches: 5      # 限制 validation 的 batch 數量，加速驗證過程

# RL 專屬設定
rl:
  lr_schedule:
    type: step
    step_size: 5000
    gamma: 0.5
  ppo_epochs: 2
  epsilon: 0.2
  kl_coef: 0.05
  kl_clip_value: 0.2
  num_samples_per_prompt: 16
  sampling_std: 1.0
  
  # Reward 權重
  w_gt: 0.0
  w_smooth: 0.1
  w_score: 0.9
  fs_reward_ckpt: "./utils/fs_reward_utils/checkpoints_goe/best_model_goe.pth"
  
  smooth_floor: 0.0
  smooth_floor_penalty: 0.0
  
  # Reference Update
  update_ref_every_epoch: 2    # 每 1 個 Epoch 結束後更新一次
  ref_ema_alpha: 0.5           # EMA 更新率 (0.01 = 每次吸收 1% 新權重, 1.0 = 硬拷貝)
  
  # Delayed Sub-Trajectory (連續/離散混合採樣機制)
  delayed_sub_trajectory:
    enabled: true
    sampling_mode: discrete    # 'continuous' (隨機窗口) | 'discrete' (離散均勻隨機)
    window_size: 5             # 連續模式下的窗口大小
    num_discrete_steps: 5      # 離散模式下隨機抽幾步

  # Ablation Study switches for 5 improvements
  ablation:
    advantage_clamp:
      enabled: false
      min_std: 1e-4
      clamp_val: 3.0
    adaptive_kl:
      enabled: false
      target_kl: 0.05
      kl_min: 0.001
      kl_max: 0.5
    noise_annealing:
      enabled: false
      start_std: 0.02
      min_std: 0.005
      decay_rate: 0.95
    step_decay_advantage:
      enabled: false
      power: 1.0
    topk_gating:
      enabled: false
      ratio: 0.5

# PyTorch Lightning 系統設定
system:
  accelerator: "gpu"
  devices: [1,2]            # RL 階段獨立指定的 GPU 裝置
  strategy: "ddp_find_unused_parameters_true"
  precision: "32-true"
  seed: 42

exp_name: "rl"

# 覆寫 Hydra 預設的輸出目錄命名規則，統一為單一的 outputs/rl_finefs_YYYY-MM-DD_HH-MM
hydra:
  run:
    dir: outputs/${exp_name}_${dataset.name}_${now:%Y-%m-%d_%H-%M}

# 資料集覆蓋設定
dataset:
  filter_single_rotation: true  # 是否過濾單圈跳（1A/1Lz 等雜訊多之樣本）
